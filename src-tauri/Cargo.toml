[package]
name = "butters"
version = "0.1.13"
description = "Keeps a busy dev machine running smooth by suggesting what to close."
authors = ["Butters"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "butters_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-autostart = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Only the process/memory/cpu half of sysinfo; no disks, networks, components.
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "user"] }
listeners = "0.6.1"
# Plain-HTTP client for the local Ollama API (no TLS needed for 127.0.0.1).
ureq = { version = "3.4.2", default-features = false, features = ["json"] }
# No "zip": Windows updates use the plain NSIS setup.exe, and this drops the vulnerable zip crate.
tauri-plugin-updater = { version = "2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-global-shortcut = "2.4.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSProcessInfo", "NSString", "NSData", "NSUUID", "NSError", "NSFileManager", "NSURL"] }
objc2-app-kit = { version = "0.3.2", features = ["NSRunningApplication", "NSWorkspace", "NSSound"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger", "UNNotification", "UNNotificationResponse"] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_ProcessStatus",
  "Win32_Media_Audio",
  "Win32_UI_Shell",
  "Win32_Storage_FileSystem",
] }

[features]
# Builds "Butters Playground": the same app, but it only sees throwaway test
# processes it starts itself (src/playground.rs). Never part of real Butters.
playground = []

[dev-dependencies]

# Small, fast release binary: https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
