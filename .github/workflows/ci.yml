# Runs the tests on real macOS and Windows machines on every push and PR.
# Actions are pinned to commit SHAs (tags can be moved); the token is read-only.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo clippy --all-targets --features playground -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  # The detection lab: ~76 realistic leftover dev servers, agent sessions,
  # MCP servers, mobile and Python tools (scripts/lab), scored against the
  # real Butters engine on a real macOS and a real Windows machine. Fails if
  # Butters misses anything it should catch, or flags what it must leave alone.
  lab:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: lab
      - name: Build the lab
        working-directory: src-tauri
        run: cargo build --release --example lab
      - name: Start the scenarios
        run: python scripts/lab/lab.py up
      - name: Score them
        working-directory: src-tauri
        shell: bash
        run: cargo run --release --example lab
      - name: Stop the scenarios
        if: always()
        run: python scripts/lab/lab.py down

  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit chromium
      - run: pnpm test:e2e

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-audit --locked
      # Linux-only GTK crates are flagged unmaintained upstream; they are never
      # built into the macOS or Windows app. Real vulnerabilities still fail.
      - run: cargo audit
        working-directory: src-tauri
